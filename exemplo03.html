<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 Exemplo02</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        ul>li {
            border: 1px solid green;
            background-color: lightgreen;
        }

        .desconstructed-pancake {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .desconstructed-pancake>* {
            flex: 1 1 120px;
        }

        .sidebar-says {
            display: grid;
            grid-template-columns: minmax(9ch, 20%) 1fr;
            gap: 10px;
        }
    </style>
</head>

<body>
    <main>
        <article class="sidebar-says">
            <section>
                <ul>
                    <li>Huguinho</li>
                    <li>Zezinho</li>
                    <li>Luizinho</li>
                    <li>Betina</li>
                </ul>
            </section>
            <section>
                Lorem ipsum dolor sit, amet consectetur adipisicing elit. Aut soluta omnis quibusdam accusamus dolor
                labore harum sed eligendi maiores? Dicta deserunt unde vitae fugiat neque sed illum sapiente ad
                voluptates.
            </section>
        </article>
    </main>
</body>

</html>
